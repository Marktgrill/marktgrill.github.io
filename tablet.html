<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bestell-Tablet | Marktgrill Ennigerloh</title>
<meta name="theme-color" content="#0d0c0b">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="style.css?v=3">
<style>
  .tablet-wrap {
    max-width: 980px;
    margin: 84px auto 32px;
    padding: 0 18px 72px;
  }
  .login-box, .order-item, .stop-bar, .filter-bar, .stat-card {
    background: rgba(24, 22, 20, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 20px;
  }
  .login-box {
    max-width: 420px;
    margin: 60px auto;
    display: grid;
    gap: 14px;
  }
  .login-box input, .pickup-input {
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(13, 12, 11, 0.9);
    color: #fff;
    font: inherit;
  }
  .stop-bar, .filter-bar {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .stat-card {
    padding: 16px 18px;
  }
  .stat-label {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.72);
  }
  .stat-value {
    font-size: 1.7rem;
    font-weight: 800;
    margin-top: 4px;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 8px 13px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .filter-btn.active {
    background: #fff;
    color: #0d0c0b;
    font-weight: 700;
    border-color: #fff;
  }
  .orders-list {
    display: grid;
    gap: 16px;
    margin-top: 20px;
  }
  .order-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge.neu { background: #f59e0b; color: #111; }
  .badge.angenommen { background: #3b82f6; color: #fff; }
  .badge.abholbereit { background: #22c55e; color: #111; }
  .badge.abgelehnt { background: #ef4444; color: #fff; }
  .order-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
    align-items: center;
  }
  .btn-accept, .btn-ready, .btn-reject {
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-accept { background: #3b82f6; color: #fff; }
  .btn-ready { background: #22c55e; color: #0d0c0b; }
  .btn-reject { background: #ef4444; color: #fff; }
  .order-actions button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* Fix für helles Design (data-theme="light") */
html[data-theme="light"] .order-card,
html[data-theme="light"] .menu-cat-card,
html[data-theme="light"] .summary-card,
html[data-theme="light"] .login-box,
html[data-theme="light"] .order-item,
html[data-theme="light"] .stop-bar,
html[data-theme="light"] .filter-bar,
html[data-theme="light"] .stat-card {
  background: #ffffff;
  border-color: rgba(13, 12, 11, 0.14);
  color: #161412;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
}

html[data-theme="light"] .cart-item {
  background: #f6f3ef;
  border-color: rgba(13, 12, 11, 0.12);
  color: #161412;
}

html[data-theme="light"] .variant-select,
html[data-theme="light"] .item-note-input,
html[data-theme="light"] .field input,
html[data-theme="light"] .login-box input,
html[data-theme="light"] .pickup-input {
  background: #ffffff;
  border-color: rgba(13, 12, 11, 0.22);
  color: #161412;
}

html[data-theme="light"] .dish-desc,
html[data-theme="light"] .dsgvo-note,
html[data-theme="light"] .stat-label,
html[data-theme="light"] #stop-status-text {
  color: rgba(22, 20, 18, 0.72) !important;
}

html[data-theme="light"] .dsgvo-note a {
  color: #161412;
}

html[data-theme="light"] .qty-btn,
html[data-theme="light"] .filter-btn {
  background: rgba(13, 12, 11, 0.06);
  border-color: rgba(13, 12, 11, 0.18);
  color: #161412;
}

html[data-theme="light"] .filter-btn.active {
  background: #161412;
  color: #ffffff;
  border-color: #161412;
}

html[data-theme="light"] .dish-row,
html[data-theme="light"] .total-line {
  border-color: rgba(13, 12, 11, 0.12);
}

html[data-theme="light"] .status-box.ok { color: #14532d; background: rgba(34, 197, 94, 0.18); }
html[data-theme="light"] .status-box.wait { color: #78350f; background: rgba(245, 158, 11, 0.22); }
html[data-theme="light"] .status-box.err,
html[data-theme="light"] .stop-box { color: #7f1d1d; background: rgba(239, 68, 68, 0.16); }
html[data-theme="light"] .field-error { color: #b91c1c; }
</style>
</head>
<body>
<script src="script.js?v=3"></script>
<main class="tablet-wrap">
  <div id="login-section" class="login-box">
    <h1 class="display" style="font-size: 1.7rem;">Tablet-Login</h1>
    <p class="lead" style="margin: 0;">Mit deinem Firebase-Nutzerkonto anmelden.</p>
    <input id="email" type="email" placeholder="Tablet-E-Mail" autocomplete="username">
    <input id="password" type="password" placeholder="Passwort" autocomplete="current-password">
    <button id="login-btn" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Anmelden</button>
    <p id="login-error" style="color: #fca5a5; margin: 0;"></p>
  </div>

  <div id="dashboard-section" style="display: none;">
    <div class="toolbar">
      <h1 class="display" style="font-size: 2rem; margin: 0;">Live-Bestellungen</h1>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="sound-btn" class="btn ghost"><i class="fa-solid fa-volume-high"></i> Ton aktivieren</button>
        <button id="logout-btn" class="btn ghost"><i class="fa-solid fa-right-from-bracket"></i> Abmelden</button>
      </div>
    </div>

    <div class="stop-bar">
      <div>
        <strong><i class="fa-solid fa-ban"></i> Bestell-Stopp („Heute keine Online-Bestellungen“)</strong><br>
        <span id="stop-status-text" style="color: rgba(255,255,255,0.75); font-size: 0.92rem;">Online-Bestellungen sind aktiv.</span>
      </div>
      <button id="toggle-stop-btn" type="button" class="btn ghost">Bestell-Stopp aktivieren</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Bestellungen (<span id="stat-range-label">Heute</span>)</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ausstehend</div>
        <div class="stat-value" id="stat-pending" style="color: #fbbf24;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Akzeptiert</div>
        <div class="stat-value" id="stat-accepted" style="color: #4ade80;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Abgelehnt</div>
        <div class="stat-value" id="stat-rejected" style="color: #f87171;">0</div>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-group" id="range-filters">
        <button type="button" class="filter-btn active" data-range="today">Heute</button>
        <button type="button" class="filter-btn" data-range="week">Woche</button>
        <button type="button" class="filter-btn" data-range="month">Monat</button>
        <button type="button" class="filter-btn" data-range="year">Jahr</button>
        <button type="button" class="filter-btn" data-range="all">Alle</button>
      </div>

      <div class="filter-group" id="status-filters">
        <button type="button" class="filter-btn active" data-status="all">Alle Status</button>
        <button type="button" class="filter-btn" data-status="active">Offen / Angenommen</button>
        <button type="button" class="filter-btn" data-status="archive">Archiv (Abholbereit / Abgelehnt)</button>
      </div>
    </div>

    <div id="orders-list" class="orders-list"></div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    query,
    orderBy,
    onSnapshot,
    doc,
    updateDoc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBPpEbNXXcPVNlW18h1v5av2IXwpXWiW5I",
    authDomain: "marktgrill-ennigerloh.firebaseapp.com",
    projectId: "marktgrill-ennigerloh",
    storageBucket: "marktgrill-ennigerloh.firebasestorage.app",
    messagingSenderId: "798938174154",
    appId: "1:798938174154:web:6b95541d76a64bf0fe1a33",
    measurementId: "G-ENG9C5LR8T"
  };

  // Optionaler Endpunkt (z. B. eigener Serverless-Endpunkt für Brevo)
  const MAIL_ENDPOINT_URL = "https://marktgrill-auth.marktgrillennigerloh.workers.dev";

  async function sendOrderEmail({ toEmail, customerName, orderIdShort, statusType, pickupTime }) {
    if (!toEmail || !MAIL_ENDPOINT_URL) return;
    try {
      await fetch(MAIL_ENDPOINT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          toEmail,
          customerName,
          orderIdShort,
          statusType,
          pickupTime: pickupTime || ""
        })
      });
    } catch (e) {
      console.error("E-Mail-Versand fehlgeschlagen:", e);
    }
  }

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginSection = document.getElementById("login-section");
  const dashboardSection = document.getElementById("dashboard-section");
  const ordersList = document.getElementById("orders-list");
  const loginError = document.getElementById("login-error");
  const toggleStopBtn = document.getElementById("toggle-stop-btn");
  const stopStatusText = document.getElementById("stop-status-text");

  const statRangeLabel = document.getElementById("stat-range-label");
  const statTotal = document.getElementById("stat-total");
  const statPending = document.getElementById("stat-pending");
  const statAccepted = document.getElementById("stat-accepted");
  const statRejected = document.getElementById("stat-rejected");

  let soundEnabled = false;
  let knownNewIds = new Set();
  let initialLoadDone = false;
  let unsubscribeOrders = null;
  let unsubscribeSettings = null;
  let currentStopState = false;
  let allOrders = [];
  let selectedRange = "today";
  let selectedStatusGroup = "all";

  const rangeLabels = {
    today: "Heute",
    week: "Woche",
    month: "Monat",
    year: "Jahr",
    all: "Alle"
  };

  function playBeep() {
    if (!soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.value = 0.2;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch (_) {}
  }

  document.getElementById("sound-btn").addEventListener("click", () => {
    soundEnabled = true;
    playBeep();
    document.getElementById("sound-btn").innerHTML = '<i class="fa-solid fa-check"></i> Ton aktiv';
  });

  document.getElementById("login-btn").addEventListener("click", async () => {
    loginError.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginError.textContent = "Login fehlgeschlagen. Bitte E-Mail und Passwort prüfen.";
    }
  });

  document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

  toggleStopBtn.addEventListener("click", async () => {
    const nextState = !currentStopState;
    await setDoc(doc(db, "einstellungen", "shop"), { bestellstopp: nextState }, { merge: true });
  });

  document.querySelectorAll("#range-filters .filter-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedRange = btn.getAttribute("data-range");
      document.querySelectorAll("#range-filters .filter-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      statRangeLabel.textContent = rangeLabels[selectedRange] || "Heute";
      updateDashboardView();
    });
  });

  document.querySelectorAll("#status-filters .filter-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedStatusGroup = btn.getAttribute("data-status");
      document.querySelectorAll("#status-filters .filter-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      updateDashboardView();
    });
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginSection.style.display = "none";
      dashboardSection.style.display = "block";
      startListening();
    } else {
      if (unsubscribeOrders) unsubscribeOrders();
      if (unsubscribeSettings) unsubscribeSettings();
      loginSection.style.display = "grid";
      dashboardSection.style.display = "none";
    }
  });

  function escapeHtml(str = "") {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function toDateObj(createdAt) {
    if (!createdAt) return null;
    if (typeof createdAt.toDate === "function") return createdAt.toDate();
    const d = new Date(createdAt);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function matchesRange(order, range) {
    if (range === "all") return true;
    const d = toDateObj(order.created_at);
    if (!d) return range === "today";

    const now = new Date();
    if (range === "today") {
      return (
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate()
      );
    }
    if (range === "year") {
      return d.getFullYear() === now.getFullYear();
    }
    if (range === "month") {
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }
    if (range === "week") {
      const day = now.getDay();
      const diffToMonday = (day + 6) % 7;
      const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
      return d >= startOfWeek;
    }
    return true;
  }

  function matchesStatusGroup(order, group) {
    const st = order.status || "neu";
    if (group === "active") return st === "neu" || st === "angenommen";
    if (group === "archive") return st === "abholbereit" || st === "abgelehnt";
    return true;
  }

  function updateDashboardView() {
    const inRange = allOrders.filter((o) => matchesRange(o, selectedRange));

    let pendingCount = 0;
    let acceptedCount = 0;
    let rejectedCount = 0;

    for (const o of inRange) {
      const st = o.status || "neu";
      if (st === "neu") pendingCount++;
      else if (st === "angenommen" || st === "abholbereit") acceptedCount++;
      else if (st === "abgelehnt") rejectedCount++;
    }

    statTotal.textContent = String(inRange.length);
    statPending.textContent = String(pendingCount);
    statAccepted.textContent = String(acceptedCount);
    statRejected.textContent = String(rejectedCount);

    const visibleOrders = inRange.filter((o) => matchesStatusGroup(o, selectedStatusGroup));
    renderOrders(visibleOrders);
  }

  function startListening() {
    unsubscribeSettings = onSnapshot(doc(db, "einstellungen", "shop"), (snap) => {
      currentStopState = snap.exists() && snap.data().bestellstopp === true;
      if (currentStopState) {
        stopStatusText.textContent = "AKTIV: Auf bestellen.html steht aktuell „Heute keine Online-Bestellungen möglich“.";
        toggleStopBtn.textContent = "Bestell-Stopp beenden";
      } else {
        stopStatusText.textContent = "Online-Bestellungen sind aktiv.";
        toggleStopBtn.textContent = "Bestell-Stopp aktivieren";
      }
    });

    const q = query(collection(db, "bestellungen"), orderBy("created_at", "desc"));
    unsubscribeOrders = onSnapshot(q, (snapshot) => {
      let hasBrandNewOrder = false;
      const items = [];

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        items.push({ id, ...data });

        if (data.status === "neu" && !knownNewIds.has(id)) {
          knownNewIds.add(id);
          if (initialLoadDone) hasBrandNewOrder = true;
        }
      });

      initialLoadDone = true;
      allOrders = items;
      if (hasBrandNewOrder) playBeep();
      updateDashboardView();
    });
  }

  function renderOrders(orders) {
    if (!orders.length) {
      ordersList.innerHTML = '<div class="order-item">Keine Bestellungen für diesen Filter vorhanden.</div>';
      return;
    }

    ordersList.innerHTML = orders.map((o) => {
      const status = o.status || "neu";
      const shortCode = o.id.slice(0, 5).toUpperCase();
      return `
        <div class="order-item" data-id="${escapeHtml(o.id)}" data-short="${escapeHtml(shortCode)}" data-email="${escapeHtml(o.kunde_kontakt || "")}" data-name="${escapeHtml(o.kunde_name || "Gast")}">
          <div class="order-top">
            <strong>#${escapeHtml(shortCode)} · ${escapeHtml(o.kunde_name || "Gast")} · ${escapeHtml(o.kunde_kontakt || "")}</strong>
            <span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span>
          </div>
          <div><strong>Bestellung:</strong> ${escapeHtml(o.artikel || "")}</div>
          ${o.gesamtpreis ? `<div><strong>Gesamtpreis:</strong> ${escapeHtml(o.gesamtpreis)}</div>` : ""}
          ${o.abholwunsch ? `<div><strong>Wunsch-Abholzeit:</strong> ${escapeHtml(o.abholwunsch)}</div>` : ""}
          ${o.hinweis ? `<div><strong>Hinweis:</strong> ${escapeHtml(o.hinweis)}</div>` : ""}
          ${o.abholzeit ? `<div><strong>Bestätigte Abholzeit:</strong> ${escapeHtml(o.abholzeit)}</div>` : ""}

          <div class="order-actions">
            <input type="text" class="pickup-input" placeholder="Abholzeit (z. B. 18:45)" value="${escapeHtml(o.abholzeit || "")}">
            <button type="button" class="btn-accept" data-action="accept">Annehmen</button>
            <button type="button" class="btn-ready" data-action="ready">Abholbereit</button>
            <button type="button" class="btn-reject" data-action="reject">Ablehnen</button>
          </div>
        </div>
      `;
    }).join("");

    ordersList.querySelectorAll(".order-item").forEach((card) => {
      const id = card.getAttribute("data-id");
      const orderIdShort = card.getAttribute("data-short");
      const toEmail = card.getAttribute("data-email");
      const customerName = card.getAttribute("data-name");
      const pickupInput = card.querySelector(".pickup-input");
      const actionButtons = card.querySelectorAll(".order-actions button");

      function setButtonsLocked(locked) {
        actionButtons.forEach((b) => { b.disabled = locked; });
      }

      card.querySelector('[data-action="accept"]').addEventListener("click", async () => {
        setButtonsLocked(true);
        try {
          const abholzeit = pickupInput.value.trim() || "schnellstmöglich";
          await updateDoc(doc(db, "bestellungen", id), {
            status: "angenommen",
            abholzeit
          });
          await sendOrderEmail({
            toEmail,
            customerName,
            orderIdShort,
            statusType: "angenommen",
            pickupTime: abholzeit
          });
        } catch (err) {
          console.error(err);
          setButtonsLocked(false);
        }
      });

      card.querySelector('[data-action="ready"]').addEventListener("click", async () => {
        setButtonsLocked(true);
        try {
          const abholzeit = pickupInput.value.trim();
          await updateDoc(doc(db, "bestellungen", id), {
            status: "abholbereit",
            ...(abholzeit ? { abholzeit } : {})
          });
          await sendOrderEmail({
            toEmail,
            customerName,
            orderIdShort,
            statusType: "abholbereit",
            pickupTime: abholzeit
          });
        } catch (err) {
          console.error(err);
          setButtonsLocked(false);
        }
      });

      card.querySelector('[data-action="reject"]').addEventListener("click", async () => {
        setButtonsLocked(true);
        try {
          await updateDoc(doc(db, "bestellungen", id), {
            status: "abgelehnt"
          });
          await sendOrderEmail({
            toEmail,
            customerName,
            orderIdShort,
            statusType: "abgelehnt",
            pickupTime: ""
          });
        } catch (err) {
          console.error(err);
          setButtonsLocked(false);
        }
      });
    });
  }
</script>
</body>
</html>
