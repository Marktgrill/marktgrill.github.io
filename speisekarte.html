<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marktgrill | Speisekarte</title>
<meta name="theme-color" content="#0d0c0b">
<meta name="description" content="Marktgrill Ennigerloh: Döner, Falafel, Salate und Snacks. Speisekarte, Tagesgericht und Öffnungszeiten.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marktgrill">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<canvas id="bg-canvas"></canvas>
<main>
<h1 class="page-title">Speisekarte</h1>
<p class="lead">Alles mit Liebe zubereitet. Bei Fragen zu Allergenen und Zusatzstoffen wende dich bitte an unser Personal.</p>
<nav class="menu-nav" id="menu-nav"></nav>
<div id="menu"></div>
</main>
<script src="script.js?v=3"></script>
<script>
fetch('speisekarte.json?t=' + Date.now()).then(r => r.json()).then(d => {
  const M = d.kategorien;
  const id = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  document.getElementById('menu-nav').innerHTML = M.map(m => `<a class="chip" href="#${id(m.titel)}">${esc(m.titel)}</a>`).join('');
  document.getElementById('menu').innerHTML = M.map(m => `<section class="menu-section" id="${id(m.titel)}"><h2><i class="fa-solid fa-${esc(m.icon)}"></i>${esc(m.titel)}</h2>${m.hinweis ? `<p class="note">${esc(m.hinweis)}</p>` : ''}<div class="menu-list">${(m.gerichte || []).map(i => `<div class="item"><h3>${esc(i.name)}</h3><span class="price">${esc(i.preis)}</span>${i.beschreibung ? `<p>${esc(i.beschreibung)}</p>` : ''}</div>`).join('')}</div></section>`).join('');
}).catch(() => { document.getElementById('menu').innerHTML = '<p>Die Speisekarte konnte gerade nicht geladen werden.</p>'; });
</script>
</body>
</html>
