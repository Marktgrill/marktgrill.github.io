backend:
  name: github
  repo: Marktgrill/marktgrill.github.io
  branch: main
  base_url: https://marktgrill-auth.marktgrillennigerloh.workers.dev

site_url: https://marktgrill.github.io
display_url: https://marktgrill.github.io

locale: de
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "tagesgericht"
    label: "Inhalte bearbeiten"
    files:
      - label: "Tagesgericht bearbeiten"
        name: "tagesgericht"
        file: "tagesgericht.json"
        format: "json"
        fields:
          - { label: "Tagesgericht anzeigen?", name: "aktiv", widget: "boolean", default: true, hint: "Ausschalten = Heute kein Tagesgericht" }
          - { label: "Ausverkauft?", name: "ausverkauft", widget: "boolean", default: false }
          - { label: "Name des Gerichts", name: "titel", widget: "string" }
          - { label: "Beschreibung", name: "beschreibung", widget: "text" }
          - { label: "Preis", name: "preis", widget: "string", hint: "z. B. 9,50 €" }
          - { label: "Vegetarisch?", name: "vegetarisch", widget: "boolean", default: false }
          - { label: "Gültig am", name: "gueltig_am", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
          - { label: "Foto (optional)", name: "bild", widget: "image", required: false }
          - { label: "Hinweis (optional)", name: "hinweis", widget: "string", required: false }

      - label: "Speisekarte (Gerichte & Preise)"
        name: "speisekarte"
        file: "speisekarte.json"
        format: "json"
        fields:
          - label: "Kategorien"
            name: "kategorien"
            widget: "list"
            label_singular: "Kategorie"
            collapsed: true
            summary: "{{fields.titel}}"
            fields:
              - { label: "Überschrift", name: "titel", widget: "string" }
              - { label: "Symbol", name: "icon", widget: "select", default: "utensils", options: ["burger", "leaf", "utensils", "box-open", "plus", "glass-water", "pizza-slice", "ice-cream", "mug-hot", "drumstick-bite", "bread-slice", "bowl-food", "fire"] }
              - { label: "Hinweis (optional)", name: "hinweis", widget: "string", required: false }
              - label: "Gerichte"
                name: "gerichte"
                widget: "list"
                label_singular: "Gericht"
                collapsed: true
                summary: "{{fields.name}} – {{fields.preis}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Preis", name: "preis", widget: "string", hint: "z. B. 7,50 € oder klein 8,00 € / groß 10,00 €" }
                  - { label: "Beschreibung (optional)", name: "beschreibung", widget: "string", required: false }
